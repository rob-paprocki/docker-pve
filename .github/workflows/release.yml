name: Release

# Runs in the PUBLIC repository when a version tag arrives (or by hand for a
# tag): attaches docker-stack-vm.sh and SHA256SUMS to a GitHub release whose
# notes are that version's CHANGELOG.md section.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release for, e.g. v4.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'rob-paprocki/docker-pve'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tag must be exactly vX.Y.Z
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag name"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Build release files
        run: |
          VERSION="${TAG#v}"
          mkdir dist
          cp docker-stack-vm.sh dist/
          (cd dist && sha256sum docker-stack-vm.sh > SHA256SUMS && cat SHA256SUMS)
          python3 scripts/release/changelog.py notes "$VERSION" > notes.md
      - name: Create GitHub release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"; exit 0
          fi
          gh release create "$TAG" dist/* --title "docker-pve ${TAG#v}" --notes-file notes.md --verify-tag
