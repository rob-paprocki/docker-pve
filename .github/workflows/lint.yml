name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CONTRIBUTING.md, "Images and diagrams": no Mermaid (the GitHub mobile
      # app shows it as raw code), and every image a doc shows from the repo
      # must follow the reader's theme: a NAME-light/NAME-dark pair in a
      # <picture> that the doc shows both of, or an SVG with its own
      # prefers-color-scheme dark palette.
      - name: Check Markdown diagrams and images
        run: |
          bad=0
          if git ls-files -z '*.md' | xargs -0 -r grep -nE '^[[:space:]]*(```|~~~)[[:space:]]*mermaid'; then
            echo "::error::Mermaid block found. Commit a rendered image instead (CONTRIBUTING.md, Images and diagrams)."; bad=1
          fi
          for doc in $(git ls-files '*.md'); do
            for img in $(awk '/^[[:space:]]*(```|~~~)/{c=!c; next} !c' "$doc" | grep -oE '!\[[^]]*\]\([^) ]+|<(img|source)[^>]*(src|srcset)="[^"]+' | sed -E 's/.*[("]//; s/[?#].*//' | grep -vE '^(https?:|data:)' || true); do
              p="$(dirname "$doc")/$img"
              case "$img" in
                *-light.*) [ -f "$p" ] && grep -qF "${img/-light./-dark.}" "$doc" && continue ;;
                *-dark.*) [ -f "$p" ] && grep -qF "${img/-dark./-light.}" "$doc" && continue ;;
                *.svg) grep -qE 'prefers-color-scheme: ?dark' "$p" 2>/dev/null && continue ;;
              esac
              echo "::error file=$doc::$img does not follow the reader's light or dark theme (CONTRIBUTING.md, Images and diagrams)."; bad=1
            done
          done
          exit "$bad"
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: '.'
          additional_files: 'docker-stack-vm.sh'
