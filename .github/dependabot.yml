version: 2
updates:
  # The two Docker image tags live inside docker-stack-vm.sh as bash
  # variable defaults (DOCKHAND_TAG, DOCKGE_TAG). Dependabot cannot parse
  # version strings inside a shell script, so those bump by hand. See
  # UPSTREAMS.md for the hand-bump recipe per dep, and .github/workflows/
  # external-upstream-watch.yml for the monthly cron that opens issues when
  # externally-blocked items (Debian signing, api.func drift) are ready to
  # pick up.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
    groups:
      actions-non-major:
        update-types: ["minor", "patch"]
